version: 2
project_name: kata-exporter
before:
  hooks:
    - go test ./...
builds:
  - main: ./cmd/kata-exporter
    binary: kata-exporter
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, config.example.json]
checksum:
  name_template: checksums.txt
