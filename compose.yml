services:
  kata-exporter:
    build: .
    image: kata-exporter:local
    restart: unless-stopped
    read_only: true
    environment:
      KATA_TOKEN: ${KATA_TOKEN:?set KATA_TOKEN in .env}
      KATA_SECRET: ${KATA_SECRET:?set KATA_SECRET in .env}
      KATA_DIARY_ENABLED: ${KATA_DIARY_ENABLED:-true}
      KATA_DIARY_WINDOW: ${KATA_DIARY_WINDOW:-24h}
    ports:
      - "127.0.0.1:9788:9788"
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    depends_on:
      - kata-exporter
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./internal/install/assets/dashboard.json:/var/lib/grafana/dashboards/kata-friends.json:ro
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
  grafana-data:
